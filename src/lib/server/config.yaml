presets:
  light:
    name: Light
    light: true
    colors: {}

  sepia:
    name: Sepia
    light: true
    colors:
      background: '#f5f0e6'
      surface: '#ebe4d4'
      text: '#3d3426'
      textMuted: '#6b5d4d'
      primary: '#b8860b'
      primaryHover: '#9a7209'
      secondary: '#8b7355'
      border: '#d4c9b5'

  dark:
    name: Dark
    light: false
    colors: {}

  high-contrast:
    name: High Contrast
    light: false
    colors:
      background: '#000000'
      surface: '#1a1a1a'
      text: '#ffffff'
      textMuted: '#e0e0e0'
      primary: '#ffff00'
      primaryHover: '#e6e600'
      secondary: '#00ffff'
      border: '#ffffff'

pages:
  - name: Start
    layout: default
    columns:
      - size: 25%
        widgets:
          - type: calendar
            cals:
              - type: ics
                url: 'https://calendar.google.com/calendar/ical/id.indonesian%23holiday%40group.v.calendar.google.com/public/basic.ics'

          - type: rss
            title: SELFTHOST RSS
            view: card
            showThumbnail: true
            feeds:
              - url: 'https://selfh.st/rss'

          - type: twitch-channel
            channels:
              - zy0xxx
              - zajef77
              - esl_dota2
      - size: full
        widgets:
          - type: split-column
            title: Reddit
            widgets:
              - type: reddit
                cache: 2h
                update: 30m
                view: card
                subreddit: selfhosted
                sort: top
                time: month
                limit: 10
              - type: reddit
                subreddit: privacy
                sort: top
                time: month
                limit: 10

          - type: services
            title: Media
            target: _blank
            column: 3
            services:
              # - type: container
              #   id: jellyfin
              #   sockPath: tcp://socket-proxy:2375
              #   name: Jellyfin
              #   description: Media Player
              #   url: https://jf.${SUBHOST}
              #   icon: di:jellyfin.svg

              # - type: container
              #   id: immich-server
              #   sockPath: tcp://socket-proxy:2375
              #   name: Immich
              #   description: Gallery
              #   url: https://im.${SUBHOST}
              #   icon: sh:immich

              # - type: container
              #   id: vaultwarden
              #   sockPath: tcp://socket-proxy:2375
              #   name: VaultWarden
              #   description: Password Manager
              #   url: https://vw.${SUBHOST}
              #   icon: auto di:vaultwarden

              - type: endpoint
                name: Jellyfin1
                description: Media Player
                icon: di:jellyfin
                url: https://jf.${SUBHOST}
                target: _blank
                statusCheck: true
                statusCheckUrl: http://jellyfin:8096
              - type: endpoint
                name: Jellyfin2
                description: Media Player
                icon: di:jellyfin
                url: https://jf.${SUBHOST}
                target: _blank
                statusCheck: true
                statusCheckUrl: http://jellyfin:8096
              - type: endpoint
                name: Jellyfin3
                description: Media Player
                icon: di:jellyfin
                url: https://jf.${SUBHOST}
                target: _blank
                statusCheck: true
                statusCheckUrl: http://jellyfin:8096
              - type: endpoint
                name: Jellyfin4
                description: Media Player
                icon: di:jellyfin
                url: https://jf.${SUBHOST}
                target: _blank
                statusCheck: true
                statusCheckUrl: https://google.com

      - size: 25%
        widgets:
          - type: calendar
            frameless: true
            cals:
              - type: ics
                url: 'https://calendar.google.com/calendar/ical/id.indonesian%23holiday%40group.v.calendar.google.com/public/basic.ics'

          # - $include: weather-hourly.yaml
          #   title: ''
          #   frameless: true
          - type: markets
            markets:
              - code: IDR=X
              - code: MSFT
                range: 15d
              - code: NVDA
                range: 15d

  - name: About
    layout: slim
    columns:
      - size: full
        widgets:
          - type: calendar
            cals:
              - type: ics
                url: 'https://calendar.google.com/calendar/ical/id.indonesian%23holiday%40group.v.calendar.google.com/public/basic.ics'
          - type: docker-containers
            title: Download
            sockPath: tcp://socket-proxy:2375
            column: 2
            containers:
              nadekodon:
                name: Nadeko~don
                description: Download Manager
                url: https://ndk.${SUBHOST}/
                icon: /assets/nadeko-don-64.png
              slskd:
                name: Slskd
                description: Soulseek Client
                url: https://sls.${SUBHOST}/
                icon: sh:slskd
