search:
  enabled: true
  target: _blank
  default: duckduckgo
  engines:
    duckduckgo:
      queryUrl: https://duckduckgo.com/?q=${QUERY}
      autoCompleteUrl: https://duckduckgo.com/ac/?q=${QUERY}
      bang: '!ddg'
    google:
      queryUrl: https://www.google.com/search?q=${QUERY}
      autoCompleteUrl: https://suggestqueries.google.com/complete/search?client=firefox&q=${QUERY}
      bang: '!g'
    brave:
      queryUrl: https://search.brave.com/search?q=${QUERY}
      autoCompleteUrl: https://search.brave.com/api/suggest?q=${QUERY}
      bang: '!br'

